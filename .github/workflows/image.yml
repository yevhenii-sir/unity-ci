name: Worker image

on:
  workflow_dispatch:
    inputs:
      unity:
        description: "GameCI tag suffix, e.g. 6000.3.8f1-android-3"
        required: true
        default: "6000.3.8f1-android-3"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Unity image is ~9 GB; make room on the runner.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        env:
          UNITY: ${{ inputs.unity }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        # The source label links the new package to this repo, otherwise GITHUB_TOKEN may not create it.
        run: |
          image="ghcr.io/${OWNER,,}/unity-runpod:ubuntu-$UNITY"
          docker build --build-arg "UNITY_IMAGE=unityci/editor:ubuntu-$UNITY" \
            --label "org.opencontainers.image.source=https://github.com/$REPO" -t "$image" builder
          docker push "$image"
          echo "Pushed $image" >> "$GITHUB_STEP_SUMMARY"
